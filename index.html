<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciência em Movimento</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18314a;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#122b49,#176b82);color:white;padding:28px 24px}header h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem)}header p{margin:7px 0 0;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}button{border:1px solid #cbd9e4;border-radius:30px;background:white;color:#173951;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#176b82;color:white;border-color:#176b82}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#fff;border:1px solid #dfebf1;border-radius:14px;padding:20px;display:flex;flex-direction:column;min-height:195px;box-shadow:0 2px 8px #112b4010}.meta{color:#42718a;font-size:.77rem;font-weight:700}.card h2{font-size:1.08rem;line-height:1.4;margin:10px 0}.card p{font-size:.91rem;color:#526373;line-height:1.5;flex:1}.card a{color:#065b83;font-weight:700;text-decoration:none}.card a:hover{text-decoration:underline}.small{color:#5b6e7c;font-size:.82rem}footer{padding-top:20px;font-size:.84rem;color:#617385}
</style></head><body><header><div style="max-width:1100px;margin:auto"><h1>✦ Ciência em Movimento</h1><p>Uma janela para a pesquisa, a tecnologia e o conhecimento contemporâneo - Feed da Disciplina Ensino de Ciência e Tecnologia 1</p></div></header><main class="wrap"><nav aria-label="Filtrar notícias" id="filtros"></nav><p class="small" id="status">Carregando notícias...</p><section class="grid" id="noticias" aria-live="polite"></section><footer>Notícias de fontes externas. Os links levam aos veículos de origem. Algumas publicações podem estar em inglês.</footer></main><script>
let artigos=[], filtro='Todas';const grade=document.getElementById('noticias'),status=document.getElementById('status'),nav=document.getElementById('filtros');
function elemento(tag,classe,texto){const e=document.createElement(tag);if(classe)e.className=classe;if(texto!==undefined)e.textContent=texto;return e}
function mostrar(){grade.replaceChildren();const visiveis=artigos.filter(n=>filtro==='Todas'||n.categoria===filtro);status.textContent=visiveis.length?`${visiveis.length} notícias • atualização automática diária`:'Nenhuma notícia disponível nesta categoria.';for(const n of visiveis){const c=elemento('article','card'),m=elemento('div','meta',n.fonte+' · '+n.categoria),h=elemento('h2','',n.titulo),p=elemento('p','',n.resumo||'Acesse a fonte para ler a matéria.'),a=elemento('a','', 'Ler notícia →');a.href=n.link;a.target='_blank';a.rel='noopener noreferrer';c.append(m,h,p,a);grade.append(c)}}
function menu(){nav.replaceChildren();for(const cat of ['Todas',...new Set(artigos.map(n=>n.categoria))]){const b=elemento('button','',cat);b.type='button';b.setAttribute('aria-pressed',String(filtro===cat));b.onclick=()=>{filtro=cat;menu();mostrar()};nav.append(b)}}
fetch('noticias.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Dados indisponíveis');return r.json()}).then(data=>{artigos=(data.noticias||[]).slice(0,48);menu();mostrar()}).catch(()=>{status.textContent='O painel ainda não recebeu notícias. Execute a atualização inicial no GitHub Actions.'});
</script></body></html>
